# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: argos.zfiar018e.zffiar018er
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.coms
        backend:
          - path: /sap
            url: http://basds5:44300
            destination: BAS-DS5
          - path: /sap/opu/odata4/sap/zui_fiar018e_risk_cntr_rpt_v4/srvd/sap/zsd_fiar018e_risk_cntr_rpt/0001/
            url: http://basds5:44300
            client: '110'
            destination: BAS-DS5  
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
