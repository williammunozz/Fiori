# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: argos.zfiar018e.zffiar018er
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: BAS-DS5
          url: http://basds5:44300
          client: '100'
        app:
          name: ZBSP_FIAR018E_R
          description: 'FIAR018E: Reporte centrales de riesgo'
          package: ZFIAR_T1
          transport: DS5K901991
        exclude:
          - /test/
